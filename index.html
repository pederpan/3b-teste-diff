<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matemática Divertida</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f8ff;
            color: #333;
            margin: 20px;
        }
        h1 {
            color: #0066cc;
        }
        ul {
            line-height: 1.8;
        }
        input, button {
            padding: 5px 10px;
            margin: 5px 0;
        }
        .resultado {
            margin-top: 10px;
            font-weight: bold;
            color: #cc0000;
        }
    </style>
</head>
<body>
    <h1>Matemática Divertida</h1>
    <p>Bem-vindo ao mundo da matemática! Aqui você pode aprender e fazer cálculos simples.</p>

    <h2>Tópicos de Matemática</h2>
    <ul>
        <li>Aritmética</li>
        <li>Álgebra</li>
        <li>Geometria</li>
        <li>Trigonometria</li>
        <li>Cálculo</li>
    </ul>

    <h2>Calculadora Simples</h2>
    <p>Digite dois números para somar:</p>
    <input type="number" id="num1" placeholder="Número 1">
    <input type="number" id="num2" placeholder="Número 2">
    <button onclick="somar()">Somar</button>

    <div class="resultado" id="resultado"></div>

    <script>
        function somar() {
            // Pega os valores dos inputs
            const n1 = parseFloat(document.getElementById('num1').value);
            const n2 = parseFloat(document.getElementById('num2').value);

            // Verifica se os números são válidos
            if (isNaN(n1) || isNaN(n2)) {
                document.getElementById('resultado').innerText = "Por favor, digite dois números válidos!";
                return;
            }

            // Calcula a soma
            const soma = n1 + n2;
            document.getElementById('resultado').innerText = `Resultado: ${soma}`;
        }
    </script>
</body>
</html>
